<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spielzeiten: NFL & WM</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQh8RkZjJOQlTn2B6eF0i4MdsE6D8Qo="
      crossorigin=""
    />
    <link rel="stylesheet" href="./src/styles.css" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
      defer
    ></script>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p id="hero-eyebrow" class="eyebrow">NFL</p>
          <h1 id="page-title">Zeiten der NFL-Spielorte</h1>
          <p class="intro">
            Live-Ortszeiten der Spielorte, auf der Karte markiert und mit den Begegnungen des gewählten Tages darunter.
          </p>
        </div>
        <div class="now-panel" aria-live="polite">
          <span>Deine Zeit</span>
          <strong id="local-time">--:--</strong>
          <small id="local-date">--</small>
        </div>
      </section>

      <section class="dashboard is-hidden" aria-label="Spielorte und Zeiten">
        <div class="map-wrap">
          <div id="map" class="map" aria-label="Landkarte der WM-Spielorte"></div>
          <div class="map-legend">
            <span class="dot match"></span> Spiel am Datum
            <span class="dot venue"></span> Spielort
          </div>
        </div>

        <aside class="venue-panel">
          <div class="panel-header">
            <h2 id="venues-title">NFL-Spielorte</h2>
            <button id="fit-map" class="icon-button fit-icon" type="button" aria-label="Alle Spielorte anzeigen" title="Alle Spielorte anzeigen"></button>
          </div>
          <div id="venue-list" class="venue-list"></div>
        </aside>
      </section>

      <section class="matches" aria-labelledby="matches-title">
        <div class="section-title">
          <div>
            <p id="matches-eyebrow" class="eyebrow">NFL Spieltag</p>
            <h2 id="matches-title">NFL-Spiele nach Datum</h2>
          </div>
          <div class="match-controls">
            <button id="toggle-venues" class="toggle-venues" type="button" aria-expanded="false">
              Spielorte einblenden
            </button>
            <label for="competition">Wettbewerb</label>
            <select id="competition">
              <option value="nfl">NFL</option>
              <option value="world-cup">FIFA World Cup 2026</option>
            </select>
            <label for="match-date">Datum</label>
            <div class="date-navigator" aria-label="Datum wechseln">
              <button id="previous-day" class="date-step" type="button" aria-label="Vortag anzeigen" title="Vortag">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15.5 5-7 7 7 7" /></svg>
              </button>
              <input id="match-date" type="date" />
              <button id="next-day" class="date-step" type="button" aria-label="Nächsten Tag anzeigen" title="Nächster Tag">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 5 7 7-7 7" /></svg>
              </button>
            </div>
            <span id="data-stamp" class="data-stamp"></span>
          </div>
        </div>
        <div id="match-list" class="match-grid"></div>
      </section>
    </main>
  </body>
</html>
